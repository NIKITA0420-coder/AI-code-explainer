<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Code Explainer & Bug Finder</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --border:#262b36;
    --text:#e8eaf0; --muted:#8b92a5; --accent:#38bdf8;
    --danger:#f87171; --success:#34d399;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system, Segoe UI, Roboto, sans-serif;
    padding:32px 16px;
  }
  .wrap{ max-width:820px; margin:0 auto; }
  h1{ font-size:24px; margin-bottom:4px; }
  p.sub{ color:var(--muted); margin-top:0; margin-bottom:24px; }
  textarea{
    width:100%; min-height:220px; background:var(--panel);
    color:var(--text); border:1px solid var(--border); border-radius:8px;
    padding:14px; font-family:'Consolas','Courier New',monospace; font-size:14px;
    resize:vertical;
  }
  select, button{
    font-size:14px; padding:10px 16px; border-radius:6px;
    border:1px solid var(--border); background:var(--panel); color:var(--text);
    cursor:pointer;
  }
  .controls{ display:flex; gap:10px; margin:14px 0 24px; align-items:center; flex-wrap:wrap; }
  button.primary{
    background:var(--accent); color:#00202b; font-weight:600; border:none;
  }
  button.primary:hover{ opacity:.9; }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  .section{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:18px; margin-bottom:18px;
  }
  .section h2{ font-size:15px; margin:0 0 10px; color:var(--accent); }
  .section pre{
    white-space:pre-wrap; word-wrap:break-word; font-family:'Consolas','Courier New',monospace;
    font-size:13.5px; margin:0; line-height:1.5;
  }
  ul.bugs{ margin:0; padding-left:20px; }
  ul.bugs li{ margin-bottom:8px; color:var(--danger); }
  .no-bugs{ color:var(--success); }
  .error{ color:var(--danger); margin-top:10px; }
  .loading{ color:var(--muted); font-style:italic; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧠 AI Code Explainer & Bug Finder</h1>
  <p class="sub">Paste code below. The AI will explain it and flag any bugs.</p>

  <textarea id="codeInput" placeholder="Paste your code here..."></textarea>

  <div class="controls">
    <select id="language">
      <option value="auto">Auto-detect language</option>
      <option value="python">Python</option>
      <option value="javascript">JavaScript</option>
      <option value="java">Java</option>
      <option value="c">C</option>
      <option value="cpp">C++</option>
    </select>
    <button class="primary" id="analyzeBtn" onclick="analyzeCode()">Analyze Code</button>
  </div>

  <div id="status"></div>
  <div id="results"></div>
</div>

<script>
  const API_URL = "http://127.0.0.1:8000/analyze";

  async function analyzeCode() {
    const code = document.getElementById("codeInput").value;
    const language = document.getElementById("language").value;
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const btn = document.getElementById("analyzeBtn");

    if (!code.trim()) {
      statusEl.innerHTML = '<p class="error">Please paste some code first.</p>';
      return;
    }

    btn.disabled = true;
    statusEl.innerHTML = '<p class="loading">Analyzing your code...</p>';
    resultsEl.innerHTML = "";

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, language }),
      });

      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || "Request failed");
      }

      const data = await res.json();
      statusEl.innerHTML = "";

      const bugsHtml = (data.bugs && data.bugs.length > 0)
        ? `<ul class="bugs">${data.bugs.map(b => `<li>⚠️ ${escapeHtml(b)}</li>`).join("")}</ul>`
        : `<p class="no-bugs">✅ No obvious bugs found.</p>`;

      resultsEl.innerHTML = `
        <div class="section">
          <h2>📖 Explanation</h2>
          <pre>${escapeHtml(data.explanation || "No explanation returned.")}</pre>
        </div>
        <div class="section">
          <h2>🐞 Bugs & Issues</h2>
          ${bugsHtml}
        </div>
        <div class="section">
          <h2>✅ Suggested Fixed Code</h2>
          <pre>${escapeHtml(data.fixed_code || code)}</pre>
        </div>
      `;
    } catch (e) {
      statusEl.innerHTML = `<p class="error">Error: ${escapeHtml(e.message)}</p>`;
    } finally {
      btn.disabled = false;
    }
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>
</body>
</html>
